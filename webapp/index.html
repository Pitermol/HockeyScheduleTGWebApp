<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hockey App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- СТРАНИЦА: МАТЧИ -->
    <div id="matches-page" class="page active">
        <!-- Блок календаря (выбор даты) -->
        <div class="date-strip-wrapper">
            <button id="prev-day-btn" class="icon-btn">◀</button>
            
            <div id="date-strip" class="date-strip">
                <!-- Сюда JS будет вставлять кнопки с датами -->
            </div>
            
            <button id="next-day-btn" class="icon-btn">▶</button>
            
            <div class="calendar-container">
                <button id="calendar-trigger-btn" class="icon-btn">📅</button>
                <!-- Скрытый нативный инпут для вызова системного календаря -->
                <input type="date" id="native-date-picker">
            </div>
        </div>

        <!-- Фильтры по лигам -->
        <div class="filters-bar">
            <button class="filter-btn active" data-league="ALL">Все</button>
            <button class="filter-btn" data-league="KHL">КХЛ</button>
            <button class="filter-btn" data-league="NHL">НХЛ</button>
        </div>

        <!-- Контейнер для списка матчей -->
        <div id="matches-container" class="matches-list">
            <!-- Сюда JS будет вставлять карточки матчей -->
            <div class="loading">Загрузка матчей...</div>
        </div>
    </div>

    <!-- СТРАНИЦА: ПРОФИЛЬ -->
    <div id="profile-page" class="page">
        <div class="profile-header">
            <div class="avatar" id="user-avatar">👤</div>
            <h2 id="user-name">Имя пользователя</h2>
        </div>
        
        <div class="profile-section">
            <h3>Любимая команда</h3>
            <div class="stub-card">
                <p>Здесь будет выбор команды</p>
                <button class="tg-button">Выбрать</button>
            </div>
        </div>

        <div class="profile-section">
            <h3>Мои прогнозы</h3>
            <div class="stub-card">
                <p>У вас пока нет активных прогнозов</p>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="matches-page">
            <span class="nav-icon">🏒</span>
            <span class="nav-text">Матчи</span>
        </button>
        <button class="nav-btn" data-target="profile-page">
            <span class="nav-icon">👤</span>
            <span class="nav-text">Профиль</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
